name: Registry delivery

on:
  push:
    branches:
      - main

concurrency:
  group: registry-delivery
  # A newer merge may replace a pending promotion, but never interrupt one after effects begin.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployment revision
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify merged revision
        run: pnpm verify

  deploy-development:
    name: Deploy development
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: development
      url: https://dev.crewhelm.app
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_ORIGIN: https://dev.crewhelm.app
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply Registry migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @crewhelm/registry db:migrate:dev
      - name: Deploy Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @crewhelm/registry deploy:dev
      - name: Deploy site gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @crewhelm/site deploy:dev
      - name: Smoke-test public Registry
        run: |
          health="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              "$DEPLOYMENT_ORIGIN/api/registry/health"
          )"
          jq --exit-status '.status == "ok"' <<< "$health" > /dev/null
          search="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              "$DEPLOYMENT_ORIGIN/api/registry/v1/recipes/search?q=deployment"
          )"
          jq --exit-status \
            '.searchVersion == 1 and (.results | type == "array")' <<< "$search" > /dev/null

  deploy-production:
    name: Deploy production
    needs: deploy-development
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://crewhelm.app
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_ORIGIN: https://crewhelm.app
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply Registry migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @crewhelm/registry db:migrate:production
      - name: Deploy Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @crewhelm/registry deploy:production
      - name: Deploy site gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @crewhelm/site deploy:production
      - name: Smoke-test public Registry
        run: |
          health="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              "$DEPLOYMENT_ORIGIN/api/registry/health"
          )"
          jq --exit-status '.status == "ok"' <<< "$health" > /dev/null
          search="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              "$DEPLOYMENT_ORIGIN/api/registry/v1/recipes/search?q=deployment"
          )"
          jq --exit-status \
            '.searchVersion == 1 and (.results | type == "array")' <<< "$search" > /dev/null
