name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint repository
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Test CLI and foundation
        run: pnpm exec vitest run --project cli --project foundation --maxWorkers=50%
      - name: Build repository
        run: pnpm build
      - name: Check release package
        run: pnpm release:check

  worker-tests:
    name: Worker tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        shard:
          - 1
          - 2
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Worker shard
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec vitest run --project worker --shard="$SHARD/2" --maxWorkers=50%

  verify:
    name: Verify
    if: ${{ always() }}
    needs:
      - checks
      - worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          WORKER_TESTS_RESULT: ${{ needs.worker-tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$WORKER_TESTS_RESULT" = success
