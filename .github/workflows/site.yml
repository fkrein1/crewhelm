name: Site build

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/site.yml
      - .nvmrc
      - apps/site/**
      - package.json
      - packages/design/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: site-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Cloudflare Workers Builds owns preview uploads and PR comments. This
    # secretless check stays safe for forked pull requests.
    name: Verify site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm --filter @crewhelm/site build
