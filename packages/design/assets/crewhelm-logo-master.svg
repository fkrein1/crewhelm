<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Blue terminal icon</title>
  <desc id="desc">A blue open square terminal frame with a chevron prompt and underscore cursor on a transparent background.</desc>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0070FF"/>
      <stop offset="0.48" stop-color="#0064FF"/>
      <stop offset="1" stop-color="#005BFA"/>
    </linearGradient>
  </defs>

  <!-- Open terminal frame -->
  <path fill="url(#blue)" d="
    M79 79
    V976 H945 V603 H855 V885 H168 V166 H855 V434 H945 V79 Z
  "/>

  <!-- Prompt chevron -->
  <path fill="url(#blue)" d="
    M265 282
    L563 478
    V551
    L265 760
    V660
    L465 518
    L265 387 Z
  "/>

  <!-- Cursor -->
  <rect x="529" y="744" width="243" height="63" rx="1" fill="url(#blue)"/>
</svg>
